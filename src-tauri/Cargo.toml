[package]
name = "flex-work-widget"
version = "0.1.0"
description = "Desktop widget for Flex today work hours"
authors = ["cykim"]
edition = "2021"

[lib]
name = "flex_work_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json", "cookies"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
open = "5"

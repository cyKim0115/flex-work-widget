<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      body.settings-window-body {
        margin: 0;
        background: #16181c;
        color: #e8eaed;
      }
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Work — 설정</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body class="settings-window-body">
    <div class="settings-window">
      <header class="settings-header">
        <div class="settings-header-row">
          <h1>Flex Work 설정</h1>
          <span id="connection-badge" class="settings-badge">—</span>
        </div>
        <p class="settings-subtitle">연결·표시·앱 옵션을 한곳에서 관리합니다.</p>
      </header>

      <div id="action-status" class="settings-status hidden" role="status" aria-live="polite"></div>

      <section class="settings-card">
        <h2 class="settings-card-title">연결</h2>
        <p class="settings-hint">
          flex.team에 Chrome 또는 Edge로 로그인한 뒤, 세션을 가져오면 근무시간이 표시됩니다.
        </p>
        <ol class="settings-steps">
          <li>브라우저에서 flex.team 로그인</li>
          <li>아래 버튼으로 세션 가져오기 (UAC 허용)</li>
        </ol>
        <div class="settings-actions settings-actions--stack">
          <button id="btn-login" class="btn secondary wide" type="button">브라우저에서 로그인</button>
          <button id="btn-harvest" class="btn primary wide" type="button">세션 가져오기</button>
        </div>
        <p id="session-detail" class="settings-detail">상태를 불러오는 중…</p>
      </section>

      <section class="settings-card">
        <h2 class="settings-card-title">표시</h2>
        <div class="settings-field">
          <span class="settings-field-label">근무시간</span>
          <p class="settings-hint">위젯 시간을 클릭해도 누적 ↔ 남은 전환이 가능합니다.</p>
          <div id="display-mode-picker" class="option-picker" role="radiogroup" aria-label="표시 모드"></div>
        </div>
        <div class="settings-field settings-field--spaced">
          <span class="settings-field-label">테마</span>
          <div id="theme-picker" class="option-picker option-picker--row" role="radiogroup" aria-label="테마"></div>
        </div>
      </section>

      <section class="settings-card">
        <h2 class="settings-card-title">앱</h2>
        <div class="settings-actions">
          <button id="btn-refresh" class="btn secondary" type="button">새로고침</button>
          <button id="btn-open-flex" class="btn secondary" type="button">flex.team 열기</button>
        </div>
        <label class="settings-toggle settings-toggle--spaced">
          <input id="autostart-toggle" type="checkbox" />
          <span>Windows 시작 시 자동 실행</span>
        </label>
        <p id="autostart-hint" class="settings-hint hidden"></p>
      </section>

      <footer class="settings-footer settings-footer--window">
        <button id="btn-close" class="btn primary wide" type="button">닫기</button>
      </footer>
    </div>
  </body>
</html>

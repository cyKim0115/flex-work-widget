<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      body.settings-window-body {
        margin: 0;
        background: #16181c;
        color: #e8eaed;
      }
    </style>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Work — 설정</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body class="settings-window-body">
    <div class="settings-window">
      <header class="settings-header">
        <h1>Flex Work 설정</h1>
        <p class="settings-subtitle">표시·테마·시작 옵션을 변경합니다. 변경 사항은 즉시 적용됩니다.</p>
      </header>

      <section class="settings-section">
        <h2 class="settings-label">표시 모드</h2>
        <p class="settings-hint">메인 위젯 시간을 클릭해도 누적 ↔ 남은 전환이 가능합니다.</p>
        <div id="display-mode-picker" class="option-picker" role="radiogroup" aria-label="표시 모드"></div>
      </section>

      <section class="settings-section">
        <h2 class="settings-label">테마</h2>
        <div id="theme-picker" class="option-picker" role="radiogroup" aria-label="테마"></div>
      </section>

      <section class="settings-section">
        <h2 class="settings-label">시작</h2>
        <label class="settings-toggle">
          <input id="autostart-toggle" type="checkbox" />
          <span>Windows 시작 시 자동 실행</span>
        </label>
        <p id="autostart-hint" class="settings-hint hidden"></p>
      </section>

      <footer class="settings-footer settings-footer--window">
        <button id="btn-close" class="btn primary wide" type="button">닫기</button>
      </footer>
    </div>
  </body>
</html>

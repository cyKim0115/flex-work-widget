<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Work</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="widget" data-tauri-drag-region>
      <header class="header" data-tauri-drag-region>
        <span class="brand" data-tauri-drag-region>
          <span class="brand-mark" aria-hidden="true" data-tauri-drag-region></span>
          <span class="title" data-tauri-drag-region>Flex Work</span>
        </span>
        <span id="state-badge" class="badge" data-tauri-drag-region>—</span>
      </header>

      <section class="body" data-tauri-drag-region>
        <div id="time" class="time" data-tauri-drag-region>——:——</div>
        <div id="subtitle" class="subtitle" data-tauri-drag-region>불러오는 중…</div>
      </section>

      <footer class="footer" data-tauri-drag-region>
        <span id="status" class="status">loading…</span>
      </footer>
    </div>

    <div id="context-backdrop" class="context-backdrop hidden">
      <div id="context-menu" class="context-menu hidden">
        <button id="menu-login-system" class="menu-item" type="button">시스템 브라우저로 로그인</button>
        <button id="menu-login" class="menu-item" type="button">앱에서 로그인</button>
        <button id="menu-harvest" class="menu-item" type="button">세션 가져오기</button>
        <button id="menu-refresh" class="menu-item" type="button">새로고침</button>
        <button id="menu-open" class="menu-item" type="button">flex.team 열기</button>
        <button id="menu-quit" class="menu-item danger" type="button">종료</button>
      </div>
    </div>
  </body>
</html>
